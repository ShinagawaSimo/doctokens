[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doctokens-excel"
version = "0.2.0"
description = "Read Excel workbooks: XLSX reading projections and initial XLS stored content."
requires-python = ">=3.10"
dependencies = ["doctokens-core>=0.2.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doctokens_excel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
