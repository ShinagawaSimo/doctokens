[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doctokens-workspace"
version = "0.0.0"
description = "Development workspace for OOXML LLM parser packages"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "Pillow>=8.0.0",
]
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/doctokens_core/tests",
    "packages/doctokens_word/tests",
    "packages/doctokens_excel/tests",
    "packages/ocr_llm_core/tests",
    "packages/doctokens_powerpoint/tests",
]
pythonpath = [
    "packages/doctokens_agent_tools/src",
    "packages/doctokens_core/src",
    "packages/doctokens_word/src",
    "packages/doctokens_excel/src",
    "packages/ocr_llm_core/src",
    "packages/doctokens_powerpoint/src",
]
# Coverage reporting is enabled by CI (see .github/workflows/ci.yml) so that
# local package-level test runs remain lightweight and neither CI nor local
# runs are gated by a repository-wide coverage percentage.
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = [
    "packages/doctokens_core/src",
    "packages/doctokens_word/src",
    "packages/doctokens_excel/src",
    "packages/ocr_llm_core/src",
    "packages/doctokens_powerpoint/src",
]

[tool.ruff]
target-version = "py310"
line-length = 130
exclude = ["out", "tmp"]
lint.select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "RUF"]
lint.ignore = ["RUF001", "RUF002", "RUF003"]
format.quote-style = "double"

[tool.mypy]
strict = true
warn_unreachable = true
files = [
    "packages/doctokens_agent_tools/src",
    "packages/doctokens_core/src",
    "packages/doctokens_word/src",
    "packages/doctokens_excel/src",
    "packages/ocr_llm_core/src",
    "packages/doctokens_powerpoint/src",
]

[[tool.mypy.overrides]]
module = "ocr_llm_core._tesseract"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "ocr_llm_core._easyocr"
disable_error_code = ["unused-ignore"]
