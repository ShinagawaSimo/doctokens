name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install packages and development tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e packages/ooxml_llm_core
          python -m pip install -e packages/docx_llm_parser
          python -m pip install -e packages/xlsx_llm_parser
          python -m pip install -e "packages/ocr_llm_core[dev]"
          python -m pip install -e packages/pptx_llm_parser
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: >-
          python -m pytest
          --cov=ooxml_llm_core --cov=docx_llm_parser
          --cov=xlsx_llm_parser --cov=ocr_llm_core
          --cov=pptx_llm_parser
          --cov-branch
