[project]
name = "ooxml-llm-core"
version = "0.1.0"
description = "Shared OOXML package infrastructure for LLM-oriented parsers"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ooxml_llm_core = ["py.typed"]
