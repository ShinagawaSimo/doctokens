[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ooxml-llm-workspace"
version = "0.0.0"
description = "Monorepo workspace for OOXML LLM parsers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = []

[tool.pytest.ini_options]
testpaths = [
    "packages/ooxml_llm_core/tests",
    "packages/docx_llm_parser/tests",
    "packages/xlsx_llm_parser/tests",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=ooxml_llm_core",
    "--cov=docx_llm_parser",
    "--cov=xlsx_llm_parser",
    "--cov-branch",
    "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true
source = ["packages/ooxml_llm_core/src", "packages/docx_llm_parser/src", "packages/xlsx_llm_parser/src"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["out", "tmp"]
lint.select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "RUF"]
lint.ignore = ["RUF001", "RUF002", "RUF003"]
format.quote-style = "double"

[tool.mypy]
strict = true
warn_unreachable = true
files = [
    "packages/ooxml_llm_core/src",
    "packages/docx_llm_parser/src",
    "packages/xlsx_llm_parser/src",
]
