[project]
name = "doctokens-core"
version = "0.2.0"
description = "Shared Office reading infrastructure: OPC, CFB, output and execution control"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doctokens_core = ["py.typed"]
