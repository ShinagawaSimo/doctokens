[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-llm-parser"
description = "Parse DOCX files into LLM-readable semantic HTML5."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["docx_llm_parser*"]

[tool.setuptools.package-data]
docx_llm_parser = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "docx_llm_parser._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=docx_llm_parser",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true
source = ["docx_llm_parser"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["out", "tmp"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
files = ["docx_llm_parser"]
exclude = "^(out|tmp)/"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
