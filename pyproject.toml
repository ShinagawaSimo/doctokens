[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ooxml-llm-workspace"
version = "0.0.0"
description = "Monorepo workspace for OOXML LLM parsers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "Pillow>=8.0.0",
]
ocr = [
    "ocr-llm-core>=0.1.0",
]
tesseract = [
    "ocr-llm-core>=0.1.0",
    "pytesseract>=0.3.10",
    "Pillow>=8.0.0",
]
easyocr = [
    "ocr-llm-core>=0.1.0",
    "easyocr>=1.7.0",
    "Pillow>=8.0.0",
]
# PaddleVLProvider uses the Python standard library and a remote PaddleOCR-VL API.
paddle = [
    "ocr-llm-core>=0.1.0",
]
all = [
    "ocr-llm-core>=0.1.0",
    "pytesseract>=0.3.10",
    "Pillow>=8.0.0",
    "easyocr>=1.7.0",
]

[tool.setuptools.packages.find]
where = [
    "packages/ooxml_llm_core/src",
    "packages/docx_llm_parser/src",
    "packages/xlsx_llm_parser/src",
    "packages/ocr_llm_core/src",
    "packages/pptx_llm_parser/src",
]

[tool.setuptools.package-data]
docx_llm_parser = ["py.typed"]
ooxml_llm_core = ["py.typed"]
ocr_llm_core = ["py.typed"]
xlsx_llm_parser = ["py.typed"]
pptx_llm_parser = ["py.typed"]

[tool.pytest.ini_options]
testpaths = [
    "packages/ooxml_llm_core/tests",
    "packages/docx_llm_parser/tests",
    "packages/xlsx_llm_parser/tests",
    "packages/ocr_llm_core/tests",
    "packages/pptx_llm_parser/tests",
]
pythonpath = [
    "packages/ooxml_llm_core/src",
    "packages/docx_llm_parser/src",
    "packages/xlsx_llm_parser/src",
    "packages/ocr_llm_core/src",
    "packages/pptx_llm_parser/src",
]
# Coverage reporting is enabled by CI (see .github/workflows/ci.yml) so that
# local package-level test runs remain lightweight and neither CI nor local
# runs are gated by a repository-wide coverage percentage.
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = [
    "packages/ooxml_llm_core/src",
    "packages/docx_llm_parser/src",
    "packages/xlsx_llm_parser/src",
    "packages/ocr_llm_core/src",
    "packages/pptx_llm_parser/src",
]

[tool.ruff]
target-version = "py310"
line-length = 130
exclude = ["out", "tmp"]
lint.select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "RUF"]
lint.ignore = ["RUF001", "RUF002", "RUF003"]
format.quote-style = "double"

[tool.mypy]
strict = true
warn_unreachable = true
files = [
    "packages/ooxml_llm_core/src",
    "packages/docx_llm_parser/src",
    "packages/xlsx_llm_parser/src",
    "packages/ocr_llm_core/src",
    "packages/pptx_llm_parser/src",
]

[[tool.mypy.overrides]]
module = "ocr_llm_core._tesseract"
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "ocr_llm_core._easyocr"
disable_error_code = ["unused-ignore"]
