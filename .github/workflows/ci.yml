name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-2025
            python: "3.12"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: constraints-ci.txt
      - name: Install packages and development tools
        run: python scripts/ci.py --install-only
      - name: Check formatting
        run: python scripts/ci.py --skip-install --step format
      - name: Lint
        run: python scripts/ci.py --skip-install --step lint
      - name: Type check
        run: python scripts/ci.py --skip-install --step types
      - name: Verify wheels
        run: python scripts/ci.py --skip-install --step wheels
      - name: Test
        run: python scripts/ci.py --skip-install --step test
